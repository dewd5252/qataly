# ─────────────────────────────────────────────────────────────────────────────
# Qataly — Keep Backend Alive
# يشتغل كل 3 أيام تلقائياً لمنع Supabase free-plan من إيقاف المشروع
# ─────────────────────────────────────────────────────────────────────────────

name: Keep Backend Alive

on:
  # كل 3 أيام الساعة 9 صباحاً UTC (12 ظهراً بتوقيت القاهرة)
  schedule:
    - cron: '0 9 */3 * *'

  # تشغيل يدوي من GitHub Actions tab لو احتجت
  workflow_dispatch:
    inputs:
      force_restore:
        description: 'إجبار الـ restore حتى لو المشروع شغال'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  SUPABASE_PROJECT_REF: qbnzxhiuoxfnxdbpozrx
  SUPABASE_URL: https://qbnzxhiuoxfnxdbpozrx.supabase.co
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  keep-alive:
    name: 🫀 Ping & Restore Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. تحقق من الـ project status ──────────────────────────────────────
      - name: Check project status
        id: status
        run: |
          echo "🔍 جاري التحقق من حالة المشروع..."

          RESPONSE=$(curl -s \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF")

          STATUS=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','UNKNOWN'))")

          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "📊 Project Status: $STATUS"

      # ── 2. Restore لو كان مش Active ─────────────────────────────────────────
      - name: Restore project if inactive
        if: |
          steps.status.outputs.status != 'ACTIVE_HEALTHY' ||
          github.event.inputs.force_restore == 'true'
        run: |
          echo "⚠️  المشروع في حالة: ${{ steps.status.outputs.status }}"
          echo "🔄 جاري إعادة تشغيل المشروع..."

          curl -s -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/restore"

          echo "⏳ انتظار 3 دقائق حتى يكتمل الـ restore..."
          sleep 180

          # تحقق مرة ثانية
          NEW_STATUS=$(curl -s \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF" \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','UNKNOWN'))")

          echo "✅ Status after restore: $NEW_STATUS"

          if [ "$NEW_STATUS" != "ACTIVE_HEALTHY" ] && [ "$NEW_STATUS" != "COMING_UP" ]; then
            echo "❌ فشل الـ restore! الحالة: $NEW_STATUS"
            exit 1
          fi

      # ── 3. Ping REST API ────────────────────────────────────────────────────
      - name: Ping REST API
        run: |
          echo "🏓 Pinging REST API..."

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1")

          echo "REST API response: $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then
            echo "✅ REST API شغالة (HTTP $HTTP_CODE)"
          else
            echo "❌ REST API مش بترد صح (HTTP $HTTP_CODE)"
            exit 1
          fi

      # ── 4. Ping Edge Functions ──────────────────────────────────────────────
      - name: Ping Edge Functions
        run: |
          echo "⚡ Pinging Edge Functions..."

          # telegram-login (لا تحتاج auth)
          TG_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/functions/v1/telegram-login")
          echo "telegram-login: HTTP $TG_CODE"

          # telegram-callback
          CB_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/functions/v1/telegram-callback")
          echo "telegram-callback: HTTP $CB_CODE"

          echo "✅ Edge Functions pingед بنجاح"

      # ── 5. ملخص ─────────────────────────────────────────────────────────────
      - name: Summary
        if: always()
        run: |
          echo ""
          echo "════════════════════════════════════"
          echo "  Qataly Backend Keep-Alive Report  "
          echo "════════════════════════════════════"
          echo "  Project : qbnzxhiuoxfnxdbpozrx"
          echo "  Time    : $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "  Status  : ${{ steps.status.outputs.status }}"
          echo "════════════════════════════════════"
