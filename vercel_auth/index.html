<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>قطعه — تسجيل الدخول عبر تليجرام</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #0A0E27;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .brand-title {
      font-size: 42px;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 6px;
    }
    .brand-subtitle {
      color: #5B8EE6;
      font-size: 13px;
      margin-bottom: 32px;
    }
    .card {
      background: #131B3E;
      border: 2px solid #2A3875;
      border-radius: 16px;
      padding: 36px 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      width: 100%;
    }
    .card h2 {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .card p {
      color: #94A3B8;
      font-size: 13px;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .tg-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 48px;
    }
    #status {
      color: #38BDF8;
      font-size: 14px;
      margin-top: 20px;
      font-weight: bold;
      min-height: 24px;
    }
    .btn-return {
      display: none;
      margin-top: 16px;
      background: #229ED9;
      color: #fff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 14px;
    }
    .credits {
      margin-top: 36px;
      color: #475569;
      font-size: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand-title">قطعه ⚡</div>
    <div class="brand-subtitle">حل وتدريب على أسئلة قطعة اللغة الإنجليزية</div>

    <div class="card">
      <h2>تسجيل الدخول بالتليجرام</h2>
      <p>اضغط على الزر الرسمي للمتابعة والتوثيق</p>

      <div class="tg-wrapper">
        <script async
          src="https://telegram.org/js/telegram-widget.js?22"
          data-telegram-login="QatalyBot"
          data-size="large"
          data-radius="10"
          data-onauth="onTelegramAuth(user)"
          data-request-access="write">
        </script>
      </div>

      <div id="status"></div>
      <a id="returnBtn" class="btn-return" href="#">العودة للتطبيق 📲</a>
    </div>

    <div class="credits">— zed32 devs / abo wehidy —</div>
  </div>

  <script>
    function onTelegramAuth(user) {
      document.getElementById('status').textContent = '✅ تم التوثيق بنجاح! جاري فتح التطبيق...';
      
      const jsonStr = JSON.stringify(user);
      const deepLink = 'qataly://auth?data=' + encodeURIComponent(jsonStr);
      
      const btn = document.getElementById('returnBtn');
      btn.href = deepLink;
      btn.style.display = 'inline-block';
      
      // Auto redirect to Flutter App via Deep Link
      window.location.href = deepLink;
    }
  </script>
</body>
</html>
